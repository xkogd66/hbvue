<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EKSKOG 365">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="104"/>
    </clipPath>
  </defs>

  <!-- tile background: white photo card -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#ffffff"/>

  <g clip-path="url(#tile)">
    <!-- green header band -->
    <rect x="16" y="16" width="480" height="150" fill="url(#g)"/>
    <!-- header dots (calendar rings) -->
    <circle cx="176" cy="92" r="18" fill="#ffffff"/>
    <circle cx="336" cy="92" r="18" fill="#ffffff"/>

    <!-- photo frame -->
    <rect x="96" y="196" width="320" height="248" rx="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="8"/>
    <!-- mountains -->
    <path d="M120 404 L216 296 L280 368 L336 312 L392 404 Z" fill="#16a34a"/>
    <!-- sun -->
    <circle cx="352" cy="248" r="26" fill="#22c55e"/>
  </g>

  <!-- rounded border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#0f172a" stroke-opacity="0.12" stroke-width="6"/>
</svg>
