name: Build and Deploy

on:
  push:
    branches:
      - main

# Never run two deploys at once; queue them instead of cancelling so every
# pushed commit still gets rolled out in order.
concurrency:
  group: deploy-hbvue
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-hbvue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply manifests
        run: |
          kubectl apply -f kustomize/full.yaml

      - name: Deploy new image
        run: |
          # Deploy by immutable per-commit tag, not a `rollout restart` of the
          # mutable :latest tag — a fresh tag is always pulled, so a node with an
          # old :latest cached can no longer serve stale code.
          kubectl set image deployment/hbvue hbvue=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n webapps
          kubectl rollout status deployment/hbvue -n webapps --timeout=120s
